name: Post to Instagram

on:
  schedule:
    - cron: "7 8 * * *"    # morning
    - cron: "7 11 * * *"   # late morning (from 25 Dec)
    - cron: "7 13 * * *"   # midday (from 11 Dec)
    - cron: "7 16 * * *"   # afternoon (from 25 Dec)
    - cron: "37 18 * * *"  # carousel (Sun) / reel (Sat)
    - cron: "7 19 * * *"   # evening
  workflow_dispatch:        # lets you press "Run workflow" to test
    inputs:
      dry_run:
        description: "Dry run (don't actually post)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Random pause (so posts don't land at robot-exact times)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1200 ))
      - name: Post next quote
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 post.py
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "puritan-gems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.csv
          git diff --cached --quiet || (git commit -m "posted" && git pull --rebase && git push)
