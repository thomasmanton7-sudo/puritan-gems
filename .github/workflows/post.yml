name: Post to Instagram, Facebook and X

on:
  schedule:                # UK times (UTC in winter); odd minutes dodge GitHub's busy queue
    - cron: "23 1 * * *"   # American evening (8:23pm New York, 5:23pm LA)
    - cron: "23 7 * * *"   # breakfast
    - cron: "23 10 * * *"  # mid-morning (from 8 Jan)
    - cron: "23 12 * * *"  # lunch (from 11 Dec)
    - cron: "41 15 * * *"  # Saturday reel / Sunday carousel
    - cron: "23 17 * * *"  # after work (from 25 Dec)
    - cron: "23 19 * * *"  # evening (until 24 Dec)
    - cron: "23 20 * * *"  # evening (from 25 Dec)
    - cron: "53 * * * *"   # hourly backup: catches any run GitHub skips (only posts what is due)
  workflow_dispatch:        # lets you press "Run workflow" to test
    inputs:
      dry_run:
        description: "Dry run (don't actually post)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Random pause (so posts don't land at robot-exact times)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1200 ))
      - name: Get the latest schedule (another run may have just posted)
        run: git fetch --depth=1 origin main && git reset --hard origin/main
      - name: Post next quote
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 post.py
      - name: Story + Reels (extra reach)
        if: always()
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          git config user.name "puritan-gems-bot"
          git config user.email "actions@users.noreply.github.com"
          pip install --quiet pillow
          python3 extras.py
      - name: Copy to Facebook and X
        if: always()
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
          TH_KEY: ${{ secrets.TH_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 crosspost.py
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "puritan-gems-bot"
          git config user.email "actions@users.noreply.github.com"
          # if two runs collided, keep this run's version of any half-merged file
          for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f" || true; done
          if grep -lE '^(<<<<<<<|>>>>>>>) ' schedule.csv crosspost_state.json extras_state.json; then
            echo "Merge leftovers found - not saving this run's record"; exit 0
          fi
          git add schedule.csv
          for f in crosspost_state.json extras_state.json th_token.enc; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "posted" && git pull --rebase && git push)
