name: Post to Instagram

on:
  schedule:                # UK times (UTC in winter); odd minutes dodge GitHub's busy queue
    - cron: "23 7 * * *"   # breakfast
    - cron: "23 10 * * *"  # mid-morning (from 8 Jan)
    - cron: "23 12 * * *"  # lunch (from 11 Dec)
    - cron: "41 15 * * *"  # Saturday reel / Sunday carousel
    - cron: "23 17 * * *"  # after work (from 25 Dec)
    - cron: "23 19 * * *"  # evening (until 24 Dec)
    - cron: "23 20 * * *"  # evening (from 25 Dec)
  workflow_dispatch:        # lets you press "Run workflow" to test
    inputs:
      dry_run:
        description: "Dry run (don't actually post)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Random pause (so posts don't land at robot-exact times)
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1200 ))
      - name: Post next quote
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 post.py
      - name: Record what was posted
        if: always()
        run: |
          git config user.name "puritan-gems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.csv
          git diff --cached --quiet || (git commit -m "posted" && git pull --rebase && git push)
