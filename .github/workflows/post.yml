name: Post to Instagram

on:
  schedule:
    - cron: "7 8 * * *"    # 08:07 UTC (= UK time in winter)
    - cron: "7 19 * * *"   # 19:07 UTC
  workflow_dispatch:        # lets you press "Run workflow" to test
    inputs:
      dry_run:
        description: "Dry run (don't actually post)"
        default: "1"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next quote
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python3 post.py
      - name: Record what was posted
        run: |
          git config user.name "puritan-gems-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule.csv
          git diff --cached --quiet || (git commit -m "posted" && git push)
